name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes unitários e de integração
        run: pytest tests/unit tests/integration -q

      - name: Testes E2E + coverage gate (linhas >= 85%, branches >= 80%)
        run: |
          mkdir -p logs
          make cov 2>&1 | tee logs/testes.log

      - name: Publicar relatório de cobertura e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-e-logs
          path: |
            htmlcov/
            coverage.xml
            logs/
